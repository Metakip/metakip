<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const isDark = localStorage.getItem('metakip-theme') === 'dark' || ((!localStorage.getItem('metakip-theme') || localStorage.getItem('metakip-theme') === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#09090b';
            document.documentElement.style.colorScheme = 'dark';
            if (document.body) {
              document.body.style.backgroundColor = '#09090b';
            }
          } else {
            document.documentElement.style.backgroundColor = '#ffffff';
            document.documentElement.style.colorScheme = 'light';
            if (document.body) {
              document.body.style.backgroundColor = '#ffffff';
            }
          }
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', isDark ? '#09090b' : '#ffffff');
          }
        } catch (_e) {}
      })();
    </script>
    <meta name="application-name" content="Metakip" />
    <meta name="apple-mobile-web-app-title" content="Metakip" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Metakip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
