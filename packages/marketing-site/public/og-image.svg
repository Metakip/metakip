    <text x="28" y="88" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="18">Browser</text>
    <text x="28" y="135" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="18">CLI</text>
    <text x="28" y="182" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="18">API</text>
    <text x="28" y="229" fill="#f5f5f5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">People + agents</text>
  </g>
