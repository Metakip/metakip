name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      js: ${{ steps.scope.outputs.js }}
      test_shared: ${{ steps.scope.outputs.test_shared }}
      test_api_unit: ${{ steps.scope.outputs.test_api_unit }}
      test_collab_unit: ${{ steps.scope.outputs.test_collab_unit }}
      test_web: ${{ steps.scope.outputs.test_web }}
      test_e2e: ${{ steps.scope.outputs.test_e2e }}
      docs: ${{ steps.scope.outputs.docs }}
      integration: ${{ steps.scope.outputs.integration }}
      build: ${{ steps.scope.outputs.build }}
      build_shared: ${{ steps.scope.outputs.build_shared }}
      build_api: ${{ steps.scope.outputs.build_api }}
      build_collab: ${{ steps.scope.outputs.build_collab }}
      build_web: ${{ steps.scope.outputs.build_web }}
      build_marketing_site: ${{ steps.scope.outputs.build_marketing_site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters.yml

      - name: Detect protected CI changes
        id: protected
        uses: dorny/paths-filter@v4
        with:
          filters: |
            protected:
              - '.github/workflows/**'
              - '.github/filters.yml'

      - name: Compute validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          GLOBAL_CHANGED: ${{ steps.filter.outputs.global }}
          PROTECTED_CHANGED: ${{ steps.protected.outputs.protected }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          COLLAB_CHANGED: ${{ steps.filter.outputs.collab }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          MARKETING_SITE_CHANGED: ${{ steps.filter.outputs.marketing_site }}
          E2E_CHANGED: ${{ steps.filter.outputs.e2e }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
        run: |
          set -euo pipefail

          full=false
          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/master" && "$CODE_CHANGED" == "true" ]]; then
            full=true
          fi
          if [[ "$GLOBAL_CHANGED" == "true" || "$PROTECTED_CHANGED" == "true" ]]; then
            full=true
          fi

          js="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" || "$COLLAB_CHANGED" == "true" || "$WEB_CHANGED" == "true" || "$MARKETING_SITE_CHANGED" == "true" || "$E2E_CHANGED" == "true" ]]; then
            js=true
          fi

          test_shared="$full"
          if [[ "$SHARED_CHANGED" == "true" ]]; then test_shared=true; fi

          test_api_unit="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" ]]; then test_api_unit=true; fi

          test_collab_unit="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$COLLAB_CHANGED" == "true" ]]; then test_collab_unit=true; fi

          test_web="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" || "$WEB_CHANGED" == "true" ]]; then test_web=true; fi

          test_e2e="$full"
          if [[ "$E2E_CHANGED" == "true" ]]; then test_e2e=true; fi

          docs="$full"
          if [[ "$DOCS_CHANGED" == "true" ]]; then docs=true; fi

          integration="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" || "$COLLAB_CHANGED" == "true" ]]; then integration=true; fi

          build="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" || "$COLLAB_CHANGED" == "true" || "$WEB_CHANGED" == "true" || "$MARKETING_SITE_CHANGED" == "true" ]]; then build=true; fi

          build_shared="$build"
          build_api="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$API_CHANGED" == "true" ]]; then build_api=true; fi

          build_collab="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$COLLAB_CHANGED" == "true" ]]; then build_collab=true; fi

          build_web="$full"
          if [[ "$SHARED_CHANGED" == "true" || "$WEB_CHANGED" == "true" ]]; then build_web=true; fi

          build_marketing_site="$full"
          if [[ "$MARKETING_SITE_CHANGED" == "true" ]]; then build_marketing_site=true; fi

          printf '%s\n' \
            "full=$full" \
            "js=$js" \
            "test_shared=$test_shared" \
            "test_api_unit=$test_api_unit" \
            "test_collab_unit=$test_collab_unit" \
            "test_web=$test_web" \
            "test_e2e=$test_e2e" \
            "docs=$docs" \
            "integration=$integration" \
            "build=$build" \
            "build_shared=$build_shared" \
            "build_api=$build_api" \
            "build_collab=$build_collab" \
            "build_web=$build_web" \
            "build_marketing_site=$build_marketing_site" >>"$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint supported documentation sources
        run: >-
          pnpm exec biome check docs/astro.config.mjs docs/src/content.config.ts docs/src/lib
          docs/src/pages docs/src/scripts

      - name: Check Astro and documentation types
        run: pnpm --filter @metakip/docs run check

      - name: Build documentation
        run: pnpm --filter @metakip/docs run build

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test shared
        if: needs.changes.outputs.test_shared == 'true'
        run: pnpm --filter @metakip/shared run test

      - name: Test API unit suite
        if: needs.changes.outputs.test_api_unit == 'true'
        run: pnpm --filter @metakip/api run test:unit

      - name: Test collaboration unit suite
        if: needs.changes.outputs.test_collab_unit == 'true'
        env:
          DATABASE_URL: postgresql://metakip:password@localhost:5432/metakip_test
          COLLAB_INTERNAL_SECRET: test-collaboration-internal-secret
        run: pnpm --filter @metakip/collab run test:unit

      - name: Test web
        if: needs.changes.outputs.test_web == 'true'
        run: pnpm --filter @metakip/web run test

      - name: Typecheck E2E package
        if: needs.changes.outputs.test_e2e == 'true'
        run: pnpm --filter @metakip/e2e run test

  integration:
    name: API and collaboration integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-${{ hashFiles('packages/api/test/global-setup.ts', 'packages/collab/test/global-setup.ts', 'packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Check database migration history
        run: pnpm --filter @metakip/api db:check
        env:
          DATABASE_URL: postgresql://metakip:password@localhost:5432/metakip

      - name: Test API integration suite
        run: pnpm --filter @metakip/api run test:integration

      - name: Test collaboration integration suite
        run: pnpm --filter @metakip/collab run test:integration

  build:
    name: Build
    needs: [changes, lint, typecheck, test, integration]
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        if: needs.changes.outputs.build_shared == 'true'
        run: pnpm --filter @metakip/shared run build

      - name: Build API
        if: needs.changes.outputs.build_api == 'true'
        run: pnpm --filter @metakip/api run build

      - name: Build collaboration server
        if: needs.changes.outputs.build_collab == 'true'
        run: pnpm --filter @metakip/collab run build

      - name: Build web
        if: needs.changes.outputs.build_web == 'true'
        run: pnpm --filter @metakip/web run build

      - name: Build marketing site
        if: needs.changes.outputs.build_marketing_site == 'true'
        run: pnpm --filter @metakip/marketing-site run build

  ci-gate:
    name: CI gate
    needs: [changes, lint, typecheck, test, docs, integration, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify main CI jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JS_SCOPE: ${{ needs.changes.outputs.js }}
          INTEGRATION_SCOPE: ${{ needs.changes.outputs.integration }}
          BUILD_SCOPE: ${{ needs.changes.outputs.build }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_SCOPE: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not complete successfully: $CHANGES_RESULT" >&2
            exit 1
          fi

          require_success() {
            local job_name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$job_name did not pass: $result" >&2
              exit 1
            fi
          }

          require_success_or_skip() {
            local job_name="$1"
            local result="$2"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "$job_name did not pass: $result" >&2
              exit 1
            fi
          }

          if [[ "$JS_SCOPE" == "true" ]]; then
            require_success "Lint" "$LINT_RESULT"
            require_success "Typecheck" "$TYPECHECK_RESULT"
            require_success "Test" "$TEST_RESULT"
          else
            require_success_or_skip "Lint" "$LINT_RESULT"
            require_success_or_skip "Typecheck" "$TYPECHECK_RESULT"
            require_success_or_skip "Test" "$TEST_RESULT"
          fi

          if [[ "$DOCS_SCOPE" == "true" ]]; then
            require_success "Documentation" "$DOCS_RESULT"
          else
            require_success_or_skip "Documentation" "$DOCS_RESULT"
          fi

          if [[ "$INTEGRATION_SCOPE" == "true" ]]; then
            require_success "API and collaboration integration" "$INTEGRATION_RESULT"
          else
            require_success_or_skip "API and collaboration integration" "$INTEGRATION_RESULT"
          fi

          if [[ "$BUILD_SCOPE" == "true" ]]; then
            require_success "Build" "$BUILD_RESULT"
          else
            require_success_or_skip "Build" "$BUILD_RESULT"
          fi
