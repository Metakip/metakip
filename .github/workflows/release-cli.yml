name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v (for example, 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version and release branch
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || {
            echo "CLI releases must be dispatched from master" >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid CLI release version: $VERSION" >&2
            exit 1
          }
          normalized_version="${VERSION%%+*}"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "tag=cli/v$VERSION" >>"$GITHUB_OUTPUT"
          if [[ "$normalized_version" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  test-unix:
    name: Test CLI (${{ matrix.os }})
    needs: validate-release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: cli/go.sum
      - name: Test, vet, and build
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
          go build -trimpath ./...
          bash ../scripts/install-cli.test.sh
          sh ../scripts/standalone-cli.e2e.sh

  test-windows:
    name: Test CLI (Windows)
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: cli/go.sum
      - name: Test, vet, and build
        working-directory: cli
        run: |
          go test ./...
          go vet ./...
          go build -trimpath ./...
      - name: Parse and test PowerShell bootstrap installer
        shell: pwsh
        run: |
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-cli.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          ./scripts/install-cli.ps1.test.ps1
          ./scripts/standalone-cli.e2e.ps1

  release-gate:
    name: Release approval
    needs: [validate-release, test-unix, test-windows]
    runs-on: ubuntu-latest
    environment:
      name: release-gate
      deployment: true
    steps:
      - run: echo "Release approved"

  release:
    name: Build and announce CLI release
    needs: [validate-release, test-unix, test-windows, release-gate]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: cli/go.sum

      - name: Ensure the release tag does not already exist
        shell: bash
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="metakip_${VERSION}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            binary="metakip"
            if [[ "$goos" == "windows" ]]; then binary="metakip.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go -C cli build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "$stage/$binary" .
            cp LICENSE cli/README.md "$stage/"
            find "$stage" -type f -exec touch -d "@$source_date_epoch" {} +
            find "$stage" -type d -exec touch -d "@$source_date_epoch" {} +
            if [[ "$goos" == "windows" ]]; then
              (cd "$stage" && zip -X -q -r "$GITHUB_WORKSPACE/dist/${archive}.zip" .)
            else
              tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -C "$stage" -czf "dist/${archive}.tar.gz" .
            fi
            if [[ "${VERSION%%+*}" != *-* ]]; then
              if [[ "$goos" == "windows" ]]; then
                cp "dist/${archive}.zip" "dist/metakip_${goos}_${goarch}.zip"
              else
                cp "dist/${archive}.tar.gz" "dist/metakip_${goos}_${goarch}.tar.gz"
              fi
            fi
            rm -rf "$stage"
          done
          cp scripts/install-cli.sh dist/install.sh
          cp scripts/install-cli.ps1 dist/install.ps1
          (cd dist && LC_ALL=C sha256sum metakip_* > checksums.txt)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Create GitHub release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${prerelease_flag[@]}" \
            dist/*
